<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>القصص والعبر - خليل المسلم</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Cairo',sans-serif; background:#050505; color:#f3e9c6; padding-bottom:90px; }
  header { text-align:center; padding:25px 10px 5px; }
  header h1 { margin:0; font-size:30px; font-weight:900;
    background:linear-gradient(90deg,var(--g4),var(--g2),var(--g),var(--g2),var(--g4));
    background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 4s linear infinite; }
  @keyframes shine { to { background-position:300% center; } }
  #count { text-align:center; color:var(--g3); font-size:14px; margin-bottom:8px; }

  .item { display:flex; align-items:center; gap:12px; background:linear-gradient(145deg,#111,var(--c2));
    margin:10px 16px; padding:14px; border-radius:16px; border:1px solid var(--b); cursor:pointer; }
  .item:active { border-color:var(--g2); box-shadow:0 0 14px rgba(var(--gr),.5); }
  .num { min-width:40px; height:40px; line-height:40px; text-align:center; border:1px solid var(--g);
    border-radius:50%; color:var(--g2); font-weight:700; }
  .name { font-size:20px; font-weight:700; color:#fff6d6; }
  .info { font-size:13px; color:var(--g3); }

  .continue, .next { display:block; margin:12px 16px; padding:14px; text-align:center; font-weight:900;
    background:linear-gradient(90deg,var(--g4),var(--g)); color:#000; border-radius:16px; cursor:pointer;
    box-shadow:0 0 14px rgba(var(--gr),.4); }

  #reader { display:none; padding:0 16px; }
  .back { margin:10px 0; padding:10px 18px; background:#111; color:var(--g2); border:1px solid var(--g);
    border-radius:12px; font-size:15px; font-family:'Cairo',sans-serif; }
  #title { text-align:center; color:var(--g2); font-size:28px; font-weight:900; margin:10px 0 5px; }
  .refs { text-align:center; color:var(--g3); font-size:14px; margin-bottom:12px; }
  #body p { font-size:18px; line-height:2.2; background:#0d0d0d; padding:14px 16px; border-radius:14px;
    border:1px solid var(--b); margin:10px 0; }
  .lesson { background:rgba(255,255,255,.04); border:1px solid var(--g); border-radius:16px; padding:14px;
    margin:16px 0; color:var(--g2); font-size:17px; line-height:2; box-shadow:0 0 14px rgba(var(--gr),.3); }


</style>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<meta name="theme-color" content="#050505">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
  <header><h1>📜 القصص والعبر</h1></header>
  <div id="count"></div>

  <div id="listPage">
    <div id="continueBox"></div>
    <div id="list"></div>
  </div>

  <div id="reader">
    <div id="title"></div>
    <div class="refs" id="refs"></div>
    <div id="body"></div>
    <div id="nextBox"></div>
  </div>

  <script src="anbiya.js"></script>
<script>
  ANBIYA.sort((a, b) => a.order - b.order);
  document.getElementById("count").textContent = ANBIYA.length + " من 25 نبياً ذُكروا في القرآن";

  function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    ANBIYA.forEach((p, i) => {
      const d = document.createElement("div");
      d.className = "item";
      d.innerHTML = '<div class="num">' + (i + 1) + '</div><div><div class="name">' + p.name + '</div><div class="info">' + p.title + '</div></div>';
      d.onclick = () => openProphet(i);
      list.appendChild(d);
    });
  }

  function openProphet(i) {
    const p = ANBIYA[i];
    localStorage.setItem("lastProphet", p.name);
    (function () {
      const dt = new Date();
      const k = dt.getFullYear() + "-" + (dt.getMonth() + 1) + "-" + dt.getDate();
      localStorage.setItem("storyDay:" + k, "1");
      const a = JSON.parse(localStorage.getItem("stat:prophets") || "[]");
      if (!a.includes(p.name)) { a.push(p.name); localStorage.setItem("stat:prophets", JSON.stringify(a)); }
    })();
    document.getElementById("listPage").style.display = "none";
    document.getElementById("reader").style.display = "block";
    document.getElementById("title").textContent = p.name + " " + (p.salam || "عليه السلام");
    document.getElementById("refs").textContent = "ذُكر في سور: " + p.surahs;
    document.getElementById("body").innerHTML =
      p.story.map(t => "<p>" + t + "</p>").join("") +
      '<div class="lesson">💡 العبرة: ' + p.lesson + '</div>';

    const nb = document.getElementById("nextBox");
    nb.innerHTML = "";
    const b = document.createElement("div");
    b.className = "next";
    if (i < ANBIYA.length - 1) {
      b.textContent = "القصة التالية: " + ANBIYA[i + 1].name + " ⬅";
      b.onclick = () => openProphet(i + 1);
    } else {
      b.textContent = "🤍 بقية القصص تُضاف قريباً";
    }
    nb.appendChild(b);
    window.scrollTo(0, 0);
  }

  function goBack() {
    document.getElementById("reader").style.display = "none";
    document.getElementById("listPage").style.display = "block";
    showContinue();
  }

  function showContinue() {
    const box = document.getElementById("continueBox");
    box.innerHTML = "";
    const nm = localStorage.getItem("lastProphet");
    const i = ANBIYA.findIndex(x => x.name === nm);
    if (i >= 0) {
      const b = document.createElement("div");
      b.className = "continue";
      b.textContent = "📌 أكمل من حيث توقفت: قصة " + ANBIYA[i].name;
      b.onclick = () => openProphet(i);
      box.appendChild(b);
    }
  }

  renderList();
  showContinue();
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }
</script>
<script src="nav.js"></script>
</body>
</html>
