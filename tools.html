<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بقية الأدوات - خليل المسلم</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Cairo',sans-serif; background:#050505; color:#f3e9c6; }
  header { text-align:center; padding:25px 10px 5px; }
  header h1 { margin:0; font-size:30px; font-weight:900;
    background:linear-gradient(90deg,var(--g4),var(--g2),var(--g),var(--g2),var(--g4));
    background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 4s linear infinite; }
  @keyframes shine { to { background-position:300% center; } }
  .sub { text-align:center; color:var(--g3); font-size:14px; }
  .sec { margin:22px 16px 0; color:var(--g); font-size:18px; font-weight:700; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 16px; }
  .tool { display:block; text-decoration:none; color:inherit; text-align:center; padding:20px 10px;
    background:linear-gradient(145deg,#111,var(--c2)); border:1px solid var(--g); border-radius:20px;
    animation:glow 3s ease-in-out infinite; }
  .tool:last-child:nth-child(odd) { grid-column:1 / -1; }
  .tool:active { transform:scale(.97); }
  @keyframes glow { 0%,100% { box-shadow:0 0 8px rgba(var(--gr),.25); } 50% { box-shadow:0 0 20px rgba(var(--gr),.55); } }
  .tool .ic { font-size:38px; }
  .tool .nm { font-size:17px; font-weight:900; color:var(--g2); margin:6px 0 2px; }
  .tool .ds { font-size:12px; color:var(--g3); line-height:1.7; }
</style>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<meta name="theme-color" content="#050505">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
  <header><h1>🧩 بقية الأدوات</h1></header>
  <div class="sub">كل أدوات خليل المسلم مرتّبة في مكانها</div>
  <div id="root"></div>

<script>
  const GROUPS = [
    ["📖 القراءة والتعلّم", [
      ["quran.html", "📖", "القرآن الكريم", "السور والبحث بالكلمة والآية"],
      ["anbiya.html", "📜", "القصص والعبر", "قصص الأنبياء الـ25"],
      ["hadith.html", "📚", "الأحاديث", "الأربعين والقدسية والبخاري ومسلم"]
    ]],
    ["🕌 العبادة اليومية", [
      ["adhkar.html", "🤲", "الأذكار", "الصباح والمساء والنوم وغيرها"],
      ["tasbih.html", "📿", "السبحة", "عدّاد التسبيح والأهداف"],
      ["prayer.html", "🕌", "أوقات الصلاة", "حسب الدولة والمدينة"]
    ]],
    ["📊 المتابعة والتحدي", [
      ["dates.html", "📅", "التواريخ", "هجري وميلادي والمناسبات"],
      ["quiz.html", "🧠", "الاختبارات", "أسئلة تتغير وتناسب مستواك"],
      ["achievements.html", "👤", "إنجازاتي", "مستواك ونقاطك وأوسمتك"],
      ["about.html", "ℹ️", "المصادر والخصوصية", "عن التطبيق ومصادره"]
    ]]
  ];
  const root = document.getElementById("root");
  GROUPS.forEach(gp => {
    const h = document.createElement("div");
    h.className = "sec";
    h.textContent = gp[0];
    root.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "grid";
    gp[1].forEach(t => {
      const a = document.createElement("a");
      a.className = "tool";
      a.href = t[0];
      a.innerHTML = '<div class="ic"></div><div class="nm"></div><div class="ds"></div>';
      a.querySelector(".ic").textContent = t[1];
      a.querySelector(".nm").textContent = t[2];
      a.querySelector(".ds").textContent = t[3];
      grid.appendChild(a);
    });
    root.appendChild(grid);
  });
  if ("serviceWorker" in navigator && location.origin !== "https://localhost") { navigator.serviceWorker.register("sw.js"); }
</script>
<script src="nav.js"></script>
</body>
</html>
