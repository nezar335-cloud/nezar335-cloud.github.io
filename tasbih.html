<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>السبحة - خليل المسلم</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:'Cairo',sans-serif; background:#050505; color:#f3e9c6; padding-bottom:90px; text-align:center; }
  header { padding:25px 10px 5px; }
  header h1 { margin:0; font-size:30px; font-weight:900;
    background:linear-gradient(90deg,var(--g4),var(--g2),var(--g),var(--g2),var(--g4));
    background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 4s linear infinite; }
  @keyframes shine { to { background-position:300% center; } }

  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:12px 14px; }
  .chip { padding:8px 14px; border:1px solid var(--b); border-radius:20px; background:#111; color:var(--g3);
    font-size:14px; font-family:'Cairo',sans-serif; }
  .chip.on { border-color:var(--g2); color:#000; background:linear-gradient(90deg,var(--g4),var(--g)); font-weight:700; }

  #zikr { font-family:'Amiri',serif; font-size:30px; color:#fff6d6; margin:10px 0 0; min-height:48px; }

  .ring { position:relative; width:260px; height:260px; margin:10px auto; }
  .ring svg { position:absolute; inset:0; transform:rotate(-90deg); }
  .ring .bg { stroke:var(--c2); }
  .ring .fg { stroke:var(--g); transition:stroke-dashoffset .25s; filter:drop-shadow(0 0 6px rgba(var(--gr),.8)); }
  #btn { position:absolute; inset:22px; border-radius:50%; border:1px solid var(--g);
    background:radial-gradient(circle at 50% 35%,var(--c3),#0d0d0d);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    box-shadow:0 0 22px rgba(var(--gr),.35); user-select:none; touch-action:manipulation;
    animation:glow 3s ease-in-out infinite; }
  @keyframes glow { 0%,100% { box-shadow:0 0 12px rgba(var(--gr),.25); } 50% { box-shadow:0 0 28px rgba(var(--gr),.6); } }
  #btn:active { transform:scale(.96); }
  #count { font-size:64px; font-weight:900; color:var(--g2); line-height:1; }
  #goalText { font-size:14px; color:var(--g3); margin-top:6px; }

  #msg { min-height:26px; color:var(--g2); font-weight:700; margin:6px 0; }
  .stats { display:flex; gap:12px; margin:10px 16px; }
  .stat { flex:1; background:linear-gradient(145deg,#111,var(--c2)); border:1px solid var(--b); border-radius:14px; padding:10px; }
  .stat b { display:block; font-size:22px; color:var(--g2); }
  .stat span { font-size:12px; color:var(--g3); }
  .reset { margin:8px 0; padding:10px 22px; background:#111; color:var(--g2); border:1px solid var(--g);
    border-radius:12px; font-size:15px; font-family:'Cairo',sans-serif; }


</style>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<meta name="theme-color" content="#050505">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
  <header><h1>📿 السبحة</h1></header>

  <div class="chips" id="zikrChips"></div>
  <div id="zikr"></div>

  <div class="ring">
    <svg width="260" height="260" viewBox="0 0 260 260">
      <circle class="bg" cx="130" cy="130" r="120" fill="none" stroke-width="10"/>
      <circle class="fg" id="fg" cx="130" cy="130" r="120" fill="none" stroke-width="10" stroke-linecap="round"/>
    </svg>
    <div id="btn" onclick="tap()">
      <div id="count">0</div>
      <div id="goalText"></div>
    </div>
  </div>

  <div id="msg"></div>

  <div class="chips" id="goalChips"></div>

  <div class="stats">
    <div class="stat"><b id="today">0</b><span>تسبيح اليوم</span></div>
    <div class="stat"><b id="total">0</b><span>المجموع الكلي</span></div>
  </div>

  <button class="reset" onclick="resetCount()">🔄 تصفير هذا الذكر</button>

  <script>
  const ZIKR = [
    "سبحان الله",
    "الحمد لله",
    "الله أكبر",
    "لا إله إلا الله",
    "أستغفر الله",
    "لا حول ولا قوة إلا بالله",
    "اللهم صلِّ وسلِّم على نبينا محمد"
  ];
  const GOALS = [33, 99, 100, 0];
  const C = 2 * Math.PI * 120;

  let cur = Number(localStorage.getItem("tasbih:cur") || 0);
  let goal = Number(localStorage.getItem("tasbih:goal") || 33);
  const fg = document.getElementById("fg");
  fg.style.strokeDasharray = C;

  function dayKey() {
    const d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }
  function getCount() { return Number(localStorage.getItem("tasbih:count:" + cur) || 0); }
  function getToday() { return Number(localStorage.getItem("tasbihDay:" + dayKey()) || 0); }
  function getTotal() { return Number(localStorage.getItem("stat:tasbihTotal") || 0); }

  function drawChips() {
    const z = document.getElementById("zikrChips");
    z.innerHTML = "";
    ZIKR.forEach((t, i) => {
      const b = document.createElement("button");
      b.className = "chip" + (i === cur ? " on" : "");
      b.textContent = t;
      b.onclick = () => { cur = i; localStorage.setItem("tasbih:cur", i); document.getElementById("msg").textContent = ""; drawChips(); render(); };
      z.appendChild(b);
    });
    const g = document.getElementById("goalChips");
    g.innerHTML = "";
    GOALS.forEach(n => {
      const b = document.createElement("button");
      b.className = "chip" + (n === goal ? " on" : "");
      b.textContent = n === 0 ? "هدف مفتوح" : "هدف " + n;
      b.onclick = () => { goal = n; localStorage.setItem("tasbih:goal", n); drawChips(); render(); };
      g.appendChild(b);
    });
  }

  function render() {
    const c = getCount();
    document.getElementById("zikr").textContent = ZIKR[cur];
    document.getElementById("count").textContent = c;
    document.getElementById("today").textContent = getToday();
    document.getElementById("total").textContent = getTotal();
    let part = 1;
    if (goal > 0) {
      const r = c % goal;
      part = (c > 0 && r === 0) ? 1 : r / goal;
      document.getElementById("goalText").textContent = "الجولة " + (Math.floor(c / goal) + (r === 0 && c > 0 ? 0 : 1)) + " · الهدف " + goal;
    } else {
      document.getElementById("goalText").textContent = "هدف مفتوح";
    }
    fg.style.strokeDashoffset = C * (1 - part);
  }

  function tap() {
    const c = getCount() + 1;
    localStorage.setItem("tasbih:count:" + cur, c);
    localStorage.setItem("tasbihDay:" + dayKey(), getToday() + 1);
    localStorage.setItem("stat:tasbihTotal", getTotal() + 1);
    const msg = document.getElementById("msg");
    if (goal > 0 && c % goal === 0) {
      if (navigator.vibrate) navigator.vibrate([80, 60, 80]);
      msg.textContent = "✨ أتممت " + goal + "، تقبّل الله منك";
    } else {
      if (navigator.vibrate) navigator.vibrate(15);
      msg.textContent = "";
    }
    render();
  }

  function resetCount() {
    if (confirm("تصفير عدّاد هذا الذكر؟")) {
      localStorage.setItem("tasbih:count:" + cur, 0);
      document.getElementById("msg").textContent = "";
      render();
    }
  }

  drawChips();
  render();
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }
</script>
<script src="nav.js"></script>
</body>
</html>
